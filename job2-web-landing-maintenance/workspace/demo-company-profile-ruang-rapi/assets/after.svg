<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="afterTitle afterDesc">
  <title id="afterTitle">Ruang tamu setelah ditata</title>
  <desc id="afterDesc">Ilustrasi ruang tamu dengan sofa hijau, meja kayu, tanaman, karya seni, dan jendela lengkung.</desc>
  <defs>
    <linearGradient id="rr-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e9dc"/>
      <stop offset="1" stop-color="#e5d9c6"/>
