<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="beforeTitle beforeDesc">
  <title id="beforeTitle">Ruang sebelum ditata</title>
  <desc id="beforeDesc">Ilustrasi ruang yang belum rapi dengan dinding tambalan, tangga, kardus, ember cat, dan karpet digulung.</desc>
  <defs>
    <linearGradient id="rr-wall-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e8db"/>
      <stop offset="1" stop-color="#e4d8c4"/>
    </linearGradient>
    <linearGradient id="rr-sky-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3e8"/>
      <stop offset="1" stop-color="#f6e7cf"/>
    </linearGradient>
    <linearGradient id="rr-floor-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cba87a"/>
      <stop offset="1" stop-color="#b78f60"/>
    </linearGradient>
  </defs>

  <!-- Wall and floor -->
  <rect width="800" height="600" fill="url(#rr-wall-b)"/>
  <ellipse cx="250" cy="150" rx="330" ry="240" fill="#ffffff" opacity=".12"/>
  <path d="M0 430h800v170H0z" fill="url(#rr-floor-b)"/>
  <g stroke="#a98355" stroke-width="1.5" opacity=".42">
    <path d="M0 470h800M0 515h800M0 560h800"/>
    <path d="M120 430v170M300 430v170M480 430v170M660 430v170"/>
  </g>
  <rect x="0" y="421" width="800" height="11" fill="#f6efe3"/>
  <path d="M0 432h800" stroke="#b78f60" stroke-width="2" opacity=".35"/>

  <!-- Wall patches and sample paint -->
  <g fill="#dfd2bd">
    <rect x="168" y="142" width="112" height="82" rx="2"/>
    <rect x="322" y="112" width="72" height="58" rx="2"/>
  </g>
  <g fill="none" stroke="#cbbaa2" stroke-width="2" stroke-dasharray="7 6">
    <rect x="168" y="142" width="112" height="82" rx="2"/>
    <rect x="322" y="112" width="72" height="58" rx="2"/>
  </g>
  <rect x="170" y="252" width="64" height="42" fill="#b4552d" opacity=".22"/>
  <rect x="170" y="252" width="64" height="42" fill="none" stroke="#b4552d" stroke-width="2" stroke-dasharray="5 5" opacity=".55"/>
  <path d="M470 300l38-22M472 306l30-17" stroke="#d8c9b4" stroke-width="3" opacity=".8"/>

  <!-- Arched window, bare with painter's tape -->
  <path d="M548 400V205a82 82 0 0 1 164 0v195z" fill="#f9f3e8"/>
  <path d="M558 392V208a72 72 0 0 1 144 0v184z" fill="url(#rr-sky-b)"/>
  <circle cx="676" cy="180" r="21" fill="#f6d59a" opacity=".85"/>
  <ellipse cx="596" cy="176" rx="24" ry="9" fill="#ffffff" opacity=".42"/>
  <ellipse cx="610" cy="192" rx="17" ry="7" fill="#ffffff" opacity=".32"/>
  <path d="M558 358c30-24 54-22 74-8 20 15 44 12 70-6v48H558z" fill="#b9c9a9" opacity=".55"/>
  <g stroke="#f9f3e8" stroke-width="5">
    <path d="M630 136v256M558 270h144"/>
  </g>
  <g stroke="#e9dcc9" stroke-width="12" opacity=".7">
    <path d="M566 222l130 158M696 222L566 380"/>
  </g>
  <rect x="540" y="392" width="180" height="13" rx="4" fill="#f4ecdf"/>
  <path d="M546 405h168" stroke="#d8c9b4" stroke-width="3" opacity=".7"/>

  <!-- Hanging bulb -->
  <path d="M400 0v132" stroke="#6b4f35" stroke-width="2"/>
  <circle cx="400" cy="164" r="24" fill="#f6d59a" opacity=".2"/>
  <path d="M392 138h16l3 14h-22z" fill="#6b4f35"/>
  <path d="M400 150c-10 0-16 8-16 16 0 7 5 10 6 16h20c1-6 6-9 6-16 0-8-6-16-16-16z" fill="#f6d59a"/>
  <path d="M397 176v-8c0-4 6-4 6 0v8" fill="none" stroke="#d8a95f" stroke-width="2"/>

  <!-- Drop cloth -->
  <path d="M148 458L620 446 702 572 118 580z" fill="#f3ece1" opacity=".78"/>
  <g stroke="#e0d3bf" stroke-width="2" fill="none" opacity=".9">
    <path d="M200 464l-30 108M320 460l-10 116M470 454l30 112M570 451l62 108"/>
    <path d="M168 520l430-16M150 550l450-16"/>
  </g>

  <!-- Ladder -->
  <ellipse cx="160" cy="482" rx="82" ry="12" fill="#7a5c3d" opacity=".14"/>
  <g transform="rotate(6 150 400)">
    <rect x="95" y="200" width="12" height="262" rx="4" fill="#a97c4f"/>
    <rect x="195" y="200" width="12" height="262" rx="4" fill="#a97c4f"/>
    <path d="M99 210v240M199 210v240" stroke="#c79a68" stroke-width="3" opacity=".75"/>
    <rect x="95" y="238" width="112" height="10" rx="3" fill="#c79a68"/>
    <rect x="95" y="290" width="112" height="10" rx="3" fill="#c79a68"/>
    <rect x="95" y="342" width="112" height="10" rx="3" fill="#c79a68"/>
    <rect x="95" y="394" width="112" height="10" rx="3" fill="#c79a68"/>
    <rect x="95" y="446" width="112" height="10" rx="3" fill="#c79a68"/>
  </g>

  <!-- Cardboard boxes -->
  <g>
    <ellipse cx="348" cy="470" rx="112" ry="18" fill="#7a5c3d" opacity=".15"/>
    <rect x="275" y="350" width="145" height="110" rx="3" fill="#c79a68"/>
    <rect x="275" y="350" width="145" height="16" fill="#b89264"/>
    <path d="M275 378h145M347 350v110" stroke="#a97c4f" stroke-width="2" opacity=".55"/>
    <rect x="331" y="350" width="16" height="110" fill="#e9dcc9" opacity=".55"/>
    <path d="M292 404h34M292 416h28" stroke="#a97c4f" stroke-width="3" opacity=".5"/>
    <path d="M275 356l-26 20M420 356l26 20" stroke="#b89264" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="408" y="392" width="96" height="68" rx="2" fill="#b89264"/>
    <rect x="408" y="392" width="96" height="10" fill="#a97c4f"/>
    <path d="M456 392v68" stroke="#a97c4f" stroke-width="2" opacity=".5"/>
    <rect x="442" y="392" width="12" height="68" fill="#e9dcc9" opacity=".42"/>
  </g>

  <!-- Paint bucket -->
  <ellipse cx="612" cy="530" rx="40" ry="8" fill="#7a5c3d" opacity=".17"/>
  <path d="M584 468h56l-6 62h-44z" fill="#d9c7ab"/>
  <ellipse cx="612" cy="468" rx="28" ry="8" fill="#e9dcc9"/>
  <ellipse cx="612" cy="468" rx="19" ry="5" fill="#8f9b7f"/>
  <path d="M584 470c0-22 12-32 28-32s28 10 28 32" fill="none" stroke="#8f653c" stroke-width="3"/>
  <path d="M600 530v-12" stroke="#f3ece1" stroke-width="5" stroke-linecap="round"/>
  <path d="M628 480l12 40" stroke="#8f9b7f" stroke-width="4" opacity=".55"/>

  <!-- Rolled rug -->
  <ellipse cx="240" cy="552" rx="96" ry="10" fill="#7a5c3d" opacity=".13"/>
  <rect x="145" y="510" width="180" height="30" rx="15" fill="#d9c7ab"/>
  <circle cx="325" cy="525" r="15" fill="#c9b393"/>
  <path d="M325 525c-6 0-8-4-6-9 3-6 12-4 12 2 0 8-10 12-16 6" fill="none" stroke="#a98d6d" stroke-width="2"/>
  <rect x="175" y="510" width="10" height="30" fill="#b4552d" opacity=".65"/>
  <rect x="270" y="510" width="10" height="30" fill="#b4552d" opacity=".65"/>

  <!-- Small debris -->
  <g fill="#b89264" opacity=".7">
    <circle cx="452" cy="536" r="3"/>
    <circle cx="468" cy="548" r="2"/>
    <rect x="486" y="522" width="14" height="3" rx="1.5" transform="rotate(18 493 523)"/>
  </g>
</svg>
